name: Release Container images

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true
        description: "Github token to use to upload release. Value of $GITHUB_TOKEN is sufficient if you give contents: write permissions to your workflow"
      DOCKER_TOKEN:
        required: false
        description: "Docker token to use to auth into docker.io"
      QUAY_TOKEN:
        required: false
        description: "Quay token to use to auth into quay.io"
    inputs:
      image_name:
        required: true
        type: string
        default: ""
        description: "Specifies name of the image to build"
      annotations:
        required: false
        type: string
        default: ""
        description: "Specifies OCI annotations to attach"
      default_tag:
        required: false
        type: string
        default: "latest"
        description: "Specifies the default tag of the image. Defaults to latest"
      upload_container:
        required: false
        type: boolean
        default: true
        description: "Specifies whether to upload images. Defaults true"

      github_registry:
        required: false
        type: string
        default: "ghcr.io"
        description: "Specifies github registry where to upload"
      github_user:
        required: false
        type: string
        default: ""
        description: "Specifies github account name to use to upload image. When specified requires secret GH_TOKEN set to value that allows writing package"
      docker_registry:
        required: false
        type: string
        default: "docker.io"
        description: "Specifies docker registry where to upload. When specified requires secret DOCKER_TOKEN to be set"
      docker_user:
        required: false
        type: string
        default: ""
        description: "Specifies docker account name to use to upload image"
      quay_registry:
        required: false
        type: string
        default: "quay.io"
        description: "Specifies docker registry where to upload"
      quay_user:
        required: false
        type: string
        default: ""
        description: "Specifies quay account name to use to upload image. When specified requires secret QUAY_TOKEN to be set"
      quay_bot_suffix:
        required: false
        type: string
        default: ""
        description: "Specifies suffix to append to username if using bot account as <user>+<suffix>"

      container_file:
        required: false
        type: string
        default: "Dockerfile"
        description: "Specifies container file to use for the purpose of the build. Defaults to Dockerfile"
      context:
        required: false
        type: string
        default: "."
        description: "Specifies context where to build container file"
      platform:
        required: false
        type: string
        default: "linux"
        description: "Specifies platform of the image to build. Defaults to linux"
      archs:
        required: false
        type: string
        default: "amd64"
        description: "Specifies list of architectures to build for. Defaults to amd64"
      build_args:
        required: false
        type: string
        default: ""
        description: "Specifies build arguments when building image"
      use_oci:
        required: false
        type: boolean
        default: false
        description: "Specifies whether to use OCI format for images"
      post_build_script:
        required: false
        type: string
        description: "Specifies the script to run after build is done. It can be used to generate tags for publishing as `tags`"
      upload_trivy_json_retention_days:
        required: false
        type: string
        default: '0'
        description: "Specifies to retain Trivy JSON for specified number of days. Defaults to 0 meaning no upload at all"
      dhi_login:
        required: false
        type: boolean
        default: false
        description: "Specifies whether to login into docker hardened image registry using docker credentials to facilitate use of these images"

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate platform list
        id: platform
        shell: python
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCHS: ${{ inputs.archs }}
        run: |
          from os import environ
          platform = environ['PLATFORM']
          platforms = ",".join((f"{platform}/{arch}" for arch in environ['ARCHS'].split()))
          with open(environ['GITHUB_OUTPUT'], 'a') as github_output:
            github_output.write(f"list={platforms}\n")

      - name: Set up QEMU
        shell: sh
        run: docker run --rm --privileged docker.io/tonistiigi/binfmt --install ${{ steps.platform.outputs.list }}

      - name: Log into dhi.io registry
        if: ${{ inputs.dhi_login && inputs.docker_user != '' }}
        uses: redhat-actions/podman-login@v2
        with:
          registry: dhi.io
          username: ${{ inputs.docker_user }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build container image
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          annotations: ${{ inputs.annotations }}
          containerfiles: ${{ inputs.container_file }}
          build-args: ${{ inputs.build_args }}
          context: ${{ inputs.context }}
          oci: ${{ inputs.use_oci }}
          platforms: ${{ steps.platform.outputs.list }}
          image: ${{ inputs.image_name }}
          tags: ${{ inputs.default_tag }}

      - name: Generate summary
        id: build_done
        shell: sh
        run: |
          echo '## Build container '${{ steps.build.outputs.image }}' image 🚀' >> $GITHUB_STEP_SUMMARY
          ${{ inputs.post_build_script }}

      # If user generated extra tags, then retag it using localhost to make sure we do not affect remote registries
      - name: Retag images with '${{ steps.build_done.outputs.tags }}'?
        id: retag
        shell: python
        env:
          DEFAULT_TAG: ${{ inputs.default_tag }}
          IMAGE_NAME: ${{ steps.build.outputs.image }}
          NEW_TAGS: ${{ steps.build_done.outputs.tags }}
        run: |
          import subprocess
          from os import environ

          default_tag = environ["DEFAULT_TAG"].strip()
          image_name = environ["IMAGE_NAME"].strip()
          new_tags = environ.get("NEW_TAGS", "")
          emit_tag = False
          if new_tags:
            for tag in new_tags.split():
              tag = tag.strip()
              if tag != default_tag:
                subprocess.run(["podman", "tag", "localhost/${{ steps.build.outputs.image-with-tag }}", f"localhost/${{ steps.build.outputs.image }}:{tag}"], capture_output=False, check=True)
                if not emit_tag:
                  emit_tag = True
                  with open(environ['GITHUB_OUTPUT'], 'a') as github_output:
                    github_output.write(f"first_tag={tag}\n")
          if not emit_tag:
            with open(environ['GITHUB_OUTPUT'], 'a') as github_output:
              github_output.write("first_tag=latest\n")

      - name: Save ${{ steps.build.outputs.image-with-tag }} image to tarball
        run: podman save -o ${{ runner.temp }}/image.tar ${{ steps.build.outputs.image-with-tag }}

      - name: Check vulnerabilities
        uses: DoumanAsh/douman-ci/.github/actions/trivy-report-vuln@master
        with:
          image_tar: "${{ runner.temp }}/image.tar"
          image_name: "${{ steps.build.outputs.image }}:${{ steps.retag.outputs.first_tag }}"
          upload_json_name: "${{ steps.build.outputs.image }}-${{ steps.retag.outputs.first_tag }}"
          pr_comment: ${{ github.event_name == 'pull_request' }}
          pr_comment_recreate: true
          upload_json_retention_days: ${{ inputs.upload_trivy_json_retention_days }}

      - name: Publish containers to ${{ inputs.docker_registry }}
        if: ${{ inputs.upload_container &&  inputs.docker_user != '' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ inputs.docker_registry }}/${{ inputs.docker_user }}
          username: ${{ inputs.docker_user }}
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.DOCKER_TOKEN }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ case(steps.build_done.outputs.tags == '', steps.build.outputs.tags, steps.build_done.outputs.tags) }}

      - name: Publish containers to ${{ inputs.github_registry }}
        if: ${{ inputs.upload_container && inputs.github_user != '' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ inputs.github_registry }}/${{ inputs.github_user }}
          username: ${{ inputs.github_user }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ case(steps.build_done.outputs.tags == '', steps.build.outputs.tags, steps.build_done.outputs.tags) }}

      - name: Publish containers to ${{ inputs.quay_registry }}
        if: ${{ inputs.upload_container && inputs.quay_user != '' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ inputs.quay_registry }}/${{ inputs.quay_user }}
          username: ${{ case(inputs.quay_bot_suffix == '', inputs.quay_user, format('{0}+{1}', inputs.quay_user, inputs.quay_bot_suffix)) }}
          password: ${{ secrets.QUAY_TOKEN }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ case(steps.build_done.outputs.tags == '', steps.build.outputs.tags, steps.build_done.outputs.tags) }}

      - name: List published tags
        if: ${{ inputs.upload_container && ( inputs.quay_user != '' || inputs.docker_user != '' || inputs.github_user != '' ) }}
        shell: python
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAGS: ${{ case(steps.build_done.outputs.tags == '', steps.build.outputs.tags, steps.build_done.outputs.tags) }}
          DOCKER_REGISTRY: ${{ inputs.docker_registry }}
          DOCKER_USER: ${{ inputs.docker_user }}
          GITHUB_REGISTRY: ${{ inputs.github_registry }}
          GITHUB_USER: ${{ inputs.github_user }}
          QUAY_REGISTRY: ${{ inputs.quay_registry }}
          QUAY_USER: ${{ inputs.quay_user }}
        run: |
          from os import environ

          image_name = environ['IMAGE_NAME']
          tags = environ['TAGS']
          docker_registry = environ['DOCKER_REGISTRY']
          docker_user = environ['DOCKER_USER']
          github_registry = environ['GITHUB_REGISTRY']
          github_user = environ['GITHUB_USER']
          quay_registry = environ['QUAY_REGISTRY']
          quay_user = environ['QUAY_USER']

          with open(environ['GITHUB_STEP_SUMMARY'], 'a') as github_output:
            github_output.write("# Published tags 📦\n")

            github_output.write("<table>")

            github_output.write("<tr>")
            github_output.write('<th>Tag</th>')
            if docker_user:
              github_output.write(f'<th><a href="https://hub.docker.com/r/{docker_user}/{image_name}" target="_blank">{docker_registry}</a></th>')
            if quay_user:
              github_output.write(f'<th><a href="https://quay.io/repository/{quay_user}/{image_name}" target="_blank">{quay_registry}</a></th>')
            if github_user:
              github_output.write(f'<th><a href="https://github.com/{github_user}/{image_name}/pkgs/container/{image_name}" target="_blank">{github_registry}</a></th>')
            github_output.write("</tr>")

            for tag in tags.split():
              github_output.write("<tr>")
              github_output.write(f"<td>{tag}</td>")
              if docker_user:
                github_output.write(f"<td>{docker_registry}/{docker_user}/{image_name}:{tag}</td>")
              if quay_user:
                github_output.write(f"<td>{quay_registry}/{quay_user}/{image_name}:{tag}</td>")
              if github_user:
                github_output.write(f"<td>{github_registry}/{github_user}/{image_name}:{tag}</td>")
              github_output.write("</tr>")
            github_output.write("</table>")

